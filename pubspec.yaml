name: in_app_update_flutter
description: "A Flutter plugin to show in-app update bottom sheet for iOS using the App Store product page via StoreKit."
version: 1.0.2
repository: https://github.com/pulkit7724/in_app_update_flutter.git

environment:
  sdk: ^3.6.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.in_app_update_flutter
        pluginClass: InAppUpdateFlutterPlugin
      ios:
        pluginClass: InAppUpdateFlutterPlugin
